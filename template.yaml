AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MedPayVault Secure Serverless API - Week 2

Resources:
  # 1. API Gateway (Protected by WAF & Rate Limiting)
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt MyUserPool.Arn

  # 2. Lambda Function (Secure Serverless Backend)
  SecureApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.9
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /secure-data
            Method: get

  # 3. Cognito User Pool (OAuth/OIDC & Authentication)
  MyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: MedPayVaultUserPool
      Policies:
      PasswordPolicy:
        MinimumLength: 8
        RequireLowercase: true
        RequireNumbers: true
        RequireSymbols: true
        RequireUppercase: true

  # 4. Cognito User Pool Client
  MyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: MedPayVaultClient
      UserPoolId: !Ref MyUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
# 5. AWS WAFv2 Web ACL (لتطبيق قواعد الحماية و Rate Limiting)
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: MedPayVaultWAF
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: WebACLMetrics
        SampledRequestsEnabled: true
      Rules:
        # Rate Limiting Rule (تحديد عدد الطلبات لحماية السيرفرلس)
        - Name: RateLimitRule
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
            SampledRequestsEnabled: true
# 6. IAM Least-Privilege Role for Lambda (تطبيق صلاحيات الـ RBAC الضيقة)
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MedPayVaultLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
MedPayVaultSecureRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: "medpayvault-secure-container-repo"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256

Outputs:
  SecureRepositoryUri:
    Description: "Secure ECR Repository URI"
    Value: !GetAtt MedPayVaultSecureRepo.RepositoryUri
