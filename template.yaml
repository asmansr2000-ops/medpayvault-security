AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MedPayVault Secure Serverless API - Week 2

Resources:
  # 1. API Gateway (Protected by WAF & Rate Limiting)
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt MyUserPool.Arn

  # 2. Lambda Function (Secure Serverless Backend)
  SecureApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.9
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /secure-data
            Method: get

  # 3. Cognito User Pool (OAuth/OIDC & Authentication)
  MyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: MedPayVaultUserPool
      Policies:
      PasswordPolicy:
        MinimumLength: 8
        RequireLowercase: true
        RequireNumbers: true
        RequireSymbols: true
        RequireUppercase: true

  # 4. Cognito User Pool Client
  MyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: MedPayVaultClient
      UserPoolId: !Ref MyUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
